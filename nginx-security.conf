# Intestazioni di sicurezza comuni (incluse in ogni blocco che definisce altri add_header,
# perché in nginx un add_header dentro un "location" annulla quelli ereditati).
add_header X-Content-Type-Options nosniff always;
add_header X-Frame-Options DENY always;
add_header Referrer-Policy no-referrer always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
# Niente script o risorse esterne. blob: serve per aprire gli allegati e scaricare i file CSV.
add_header Content-Security-Policy "default-src 'self'; img-src 'self' data: blob:; style-src 'self' 'unsafe-inline'; script-src 'self'; font-src 'self'; connect-src 'self'; frame-src blob:; object-src 'none'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
# Gestionale privato: i motori di ricerca non devono indicizzarlo.
add_header X-Robots-Tag "noindex, nofollow" always;
