# Gestionale del fiorista: pagina unica (file statici) + API.
# Pubblicato con Tailscale Funnel (28 ott 2026, al posto di Del Duca sulla porta 10000) e raggiunto anche da Traefik:
# NON si usa nessuna intestazione per conoscere l'IP del visitatore (CF-Connecting-IP si potrebbe falsificare).
# Con un tunnel Cloudflare si potrebbe tornare a: set_real_ip_from <reti private>; real_ip_header CF-Connecting-IP;

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    resolver 127.0.0.11 valid=10s;

    client_max_body_size 64k;
    server_tokens off;
    absolute_redirect off;

    include /etc/nginx/snippets/security.conf;

    if ($host ~* ^www\.(?<senza_www>.+)$) { return 301 https://$senza_www$request_uri; }

    # Dati (PostgREST): le regole su chi vede cosa stanno nel database.
    location /rest/v1/ {
        set $pgrst http://postgrest:3000;
        rewrite ^/rest/v1/(.*)$ /$1 break;
        proxy_pass $pgrst;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_read_timeout 60s;
    }

    # Login e rinnovo del token
    location /auth/ {
        set $authsvc http://auth:4000;
        rewrite ^/auth/(.*)$ /$1 break;
        proxy_pass $authsvc;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        access_log off; # il corpo contiene la password: niente da guadagnare a registrare
    }

    # Allegati delle spese (fino a 8 MB)
    location = /api/allegati {
        client_max_body_size 9m;
        set $authsvc http://auth:4000;
        proxy_pass $authsvc;
        proxy_set_header Host $host;
        proxy_read_timeout 60s;
    }
    location /api/ {
        set $authsvc http://auth:4000;
        proxy_pass $authsvc;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # Aggiornamenti in tempo reale (SSE). Il token è nell'indirizzo: niente log.
    location = /realtime/stream {
        set $authsvc http://auth:4000;
        rewrite ^/realtime/stream$ /stream break;
        proxy_pass $authsvc;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 1h;
        access_log off;
    }

    location ~* \.(svg|ico|png)$ { include /etc/nginx/snippets/security.conf; add_header Cache-Control "public, max-age=604800"; }
    # CSS e JS: sempre ricontrollati (dopo un aggiornamento si vede subito la versione nuova)
    location ~* \.(css|js)$ { include /etc/nginx/snippets/security.conf; add_header Cache-Control "no-cache"; }

    location / {
        include /etc/nginx/snippets/security.conf;
        add_header Cache-Control "no-store";
        try_files $uri $uri/ /index.html;
    }
}
